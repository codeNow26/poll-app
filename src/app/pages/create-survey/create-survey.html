<dialog #surveyDialog class="create-survey" aria-labelledby="create-survey-title"
  (cancel)="$event.preventDefault(); cancelSurvey()"
  (click)="closeOnBackdropClick($event)"
  (pointerdown)="rememberPointerStart($event)">

  <header class="create-survey__header" [inert]="isSuccessOverlayOpen()">
    <div class="create-survey__header-left">
      <p class="create-survey__draft">Draft</p>
      <h1 id="create-survey-title" class="create-survey__title" tabindex="-1" autofocus>
        Create new survey
      </h1>
    </div>

    <button class="create-survey__cancel" type="button"
      (click)="cancelSurvey()" aria-label="Cancel survey creation">
      <span class="create-survey__cancel-text">Cancel</span>
      <img src="assets/icons/close.svg" alt="">
    </button>
  </header>

  <form [formGroup]="surveyForm" (ngSubmit)="submitSurvey()"
    [inert]="isSuccessOverlayOpen()" id="survey-form" class="create-survey__form">
    <div class="create-survey__form-content">
      <app-survey-details
        [form]="surveyForm"
        [maxTitleLength]="maxTitleLength"
        [maxDescriptionLength]="maxDescriptionLength"
        [minimumDate]="getTodayDate()"
      />

      <div class="create-survey__questions">
        @for (question of questions.controls; track question; let questionIndex = $index) {
          <app-survey-question
            [question]="question"
            [questionIndex]="questionIndex"
            [maxQuestionLength]="maxQuestionLength"
            [maxAnswerLength]="maxAnswerLength"
            [maxAnswers]="maxAnswers"
            (questionRemoved)="removeQuestion(questionIndex)"
            (answerAdded)="addAnswer(questionIndex)"
            (answerRemoved)="removeAnswer(questionIndex, $event)"
          />
        }

        <button class="create-survey__add-question" type="button" (click)="addQuestion()">
          Add next question
          <img src="assets/icons/add_circle.svg" alt="">
        </button>
      </div>
    </div>

    @if (showSaveError()) {
      <p class="create-survey__error" role="alert">
        Your survey could not be saved. Please try again.
      </p>
    }

    <div class="create-survey__actions">
      <button type="submit" class="create-survey__publish" [disabled]="isSaving()">
        <span>{{ isSaving() ? 'Saving…' : 'Publish' }}</span>
        <img src="assets/icons/check.svg" alt="">
      </button>
    </div>
  </form>

  @if (isSuccessOverlayOpen()) {
    <app-survey-success (closed)="closeSuccessOverlay()" />
  }
</dialog>
