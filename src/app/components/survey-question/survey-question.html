<fieldset [formGroup]="question()" class="create-survey__question">
  <legend class="create-survey__question-heading">
    <span class="create-survey__question-heading-content">
      <span id="question-{{ questionIndex() + 1 }}-heading">
        {{ questionIndex() + 1 }}. Question
      </span>
      <button class="create-survey__delete" type="button"
        (click)="questionRemoved.emit()"
        [attr.aria-label]="'Delete question ' + (questionIndex() + 1)">
        <img src="assets/icons/delete.svg" alt="">
      </button>
    </span>
  </legend>

  <div class="create-survey__question-row">
    <input formControlName="questionText" type="text"
      class="create-survey__input"
      [maxlength]="maxQuestionLength()"
      id="question-{{ questionIndex() + 1 }}-text"
      [attr.aria-labelledby]="'question-' + (questionIndex() + 1) + '-heading'"
      placeholder="Which date would work best for you?">
  </div>

  <p class="create-survey__error"
    [class.create-survey__error--hidden]="
      !(question().controls.questionText.invalid && question().controls.questionText.touched)">
    Please enter a question.
  </p>

  <div class="create-survey__answers">
    <div class="create-survey__answers-header">
      <p>Answers</p>
      <label class="create-survey__multiple">
        <input formControlName="multipleAnswers" type="checkbox">
        <span>Allow multiple answers.</span>
      </label>
    </div>

    <div formArrayName="answers">
      @for (answer of question().controls.answers.controls; track answer; let answerIndex = $index) {
        <div class="create-survey__answer">
          <label class="create-survey__answer-label"
            for="question-{{ questionIndex() + 1 }}-answer-{{ answerIndex + 1 }}">
            {{ answerLabels[answerIndex] }}.
          </label>

          <input class="create-survey__input" type="text"
            id="question-{{ questionIndex() + 1 }}-answer-{{ answerIndex + 1 }}"
            [formControlName]="answerIndex" [maxlength]="maxAnswerLength()">

          <button class="create-survey__delete" type="button"
            (click)="answerRemoved.emit(answerIndex)"
            [attr.aria-label]="'Delete answer ' + answerLabels[answerIndex]">
            <img src="assets/icons/delete.svg" alt="">
          </button>

          <p class="create-survey__error"
            [class.create-survey__error--hidden]="!(answer.invalid && answer.touched)">
            Please enter an answer.
          </p>
        </div>
      }
    </div>
  </div>

  <button class="create-survey__add-answer-btn" type="button"
    [disabled]="question().controls.answers.length >= maxAnswers()"
    (click)="answerAdded.emit()">
    Add answer
    <img src="assets/icons/add_circle.svg" alt="">
  </button>
</fieldset>
