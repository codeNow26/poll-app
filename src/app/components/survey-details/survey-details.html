@let controls = form().controls;

<div class="create-survey__details">
  <div class="create-survey__details-left">
    <div class="create-survey__field">
      <label for="survey-name" class="create-survey__label">Survey name</label>
      <div class="create-survey__clear-row">
        <input type="text" id="survey-name" class="create-survey__input"
          [formControl]="controls.surveyName" [maxlength]="maxTitleLength()">
        <button class="create-survey__delete" type="button"
          (click)="controls.surveyName.setValue('')" aria-label="Clear survey name">
          <img src="assets/icons/delete.svg" alt="">
        </button>
      </div>
      <p class="create-survey__error"
        [class.create-survey__error--hidden]="
          !(controls.surveyName.invalid && controls.surveyName.touched)">
        Please enter a survey name.
      </p>
    </div>

    <div class="create-survey__details-row">
      <div class="create-survey__field">
        <label for="survey-enddate" class="create-survey__label">
          Set end date <span>(optional)</span>
        </label>
        <div class="create-survey__clear-row">
          <input type="date" id="survey-enddate" class="create-survey__input"
            [formControl]="controls.surveyDeadline" [min]="minimumDate()"
            [attr.aria-describedby]="
              controls.surveyDeadline.invalid && controls.surveyDeadline.touched ? 'deadline-error' : null">
          <button class="create-survey__delete" type="button"
            (click)="controls.surveyDeadline.setValue('')" aria-label="Clear end date">
            <img src="assets/icons/delete.svg" alt="">
          </button>
        </div>
        <p id="deadline-error" class="create-survey__error"
          [class.create-survey__error--hidden]="
            !(controls.surveyDeadline.invalid && controls.surveyDeadline.touched)">
          Please enter a valid date: today or later.
        </p>
      </div>

      <div class="create-survey__category">
        <button class="create-survey__category-button" type="button"
          [attr.aria-expanded]="isCategoryDropdownOpen" aria-controls="create-category-menu"
          (click)="isCategoryDropdownOpen = !isCategoryDropdownOpen">
          <span>{{ controls.surveyCategory.value || 'Choose category' }}</span>
          <img class="create-survey__category-arrow"
            [class.create-survey__category-arrow--open]="isCategoryDropdownOpen"
            src="icons/arrow_drop_down.svg" alt="">
        </button>
        <p class="create-survey__error"
          [class.create-survey__error--hidden]="
            !(controls.surveyCategory.invalid && controls.surveyCategory.touched)">
          Please choose a category.
        </p>
        @if (isCategoryDropdownOpen) {
          <div id="create-category-menu" class="create-survey__category-menu">
            @for (category of categories; track category) {
              <button type="button" (click)="selectCategory(category)">
                {{ category }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <div class="create-survey__details-right">
    <div class="create-survey__field">
      <label for="survey-description" class="create-survey__label">
        Describing text <span>(optional)</span>
      </label>
      <div class="create-survey__clear-row">
        <textarea id="survey-description" class="create-survey__textarea"
          [formControl]="controls.surveyDescription"
          [maxlength]="maxDescriptionLength()"></textarea>
        <button class="create-survey__delete" type="button"
          (click)="controls.surveyDescription.setValue('')" aria-label="Clear description">
          <img src="assets/icons/delete.svg" alt="">
        </button>
      </div>
    </div>
  </div>
</div>
